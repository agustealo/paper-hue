name: Paper Hue Presentation Proof

on:
  pull_request:
    paths:
      - '**.php'
      - 'client-side/**'
      - 'tools/showcase/**'
      - '.wp-env.json'
      - '.github/workflows/presentation-proof.yml'
  push:
    branches:
      - master
    paths:
      - '**.php'
      - 'client-side/**'
      - 'tools/showcase/**'
      - '.wp-env.json'
      - '.github/workflows/presentation-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Real WordPress browser captures
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PAPER_HUE_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PAPER_HUE_CANDIDATE_SHA }}

      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "${ACTUAL_SHA}" = "${PAPER_HUE_CANDIDATE_SHA}"
          echo "PAPER_HUE_ACTUAL_SHA=${ACTUAL_SHA}" >> "${GITHUB_ENV}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pinned browser/runtime tools
        run: npm install --no-save @wordpress/env@11.16.0 playwright@1.63.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Boot WordPress 7.1
        run: npx wp-env start

      - name: Seed real Paper Hue content
        run: bash tools/showcase/seed-wordpress.sh

      - name: Prepare one-run admin capture session
        shell: bash
        run: |
          set -euo pipefail
          AUTH_FILE="${RUNNER_TEMP}/paper-hue-admin-auth.json"
          CAPTURE_PASSWORD="$(openssl rand -hex 24)"
          export AUTH_FILE CAPTURE_PASSWORD
          npx wp-env run cli wp user update admin --user_pass="${CAPTURE_PASSWORD}" > /dev/null
          python - <<'PY'
          import json, os
          with open(os.environ['AUTH_FILE'], 'w', encoding='utf-8') as handle:
              json.dump({'username': 'admin', 'password': os.environ['CAPTURE_PASSWORD']}, handle)
          PY
          echo "PAPER_HUE_ADMIN_AUTH_FILE=${AUTH_FILE}" >> "${GITHUB_ENV}"

      - name: Verify rendered homepage
        run: curl --fail --silent --show-error http://localhost:8888/ > /dev/null

      - name: Capture real screenshots
        env:
          GITHUB_SHA: ${{ env.PAPER_HUE_ACTUAL_SHA }}
        run: node tools/showcase/capture-showcase.js

      - name: Record runtime versions and candidate identity
        run: |
          npx wp-env run cli wp core version > artifacts/wordpress-version.txt
          npx wp-env run cli php -v > artifacts/php-version.txt
          printf '%s\n' "${PAPER_HUE_ACTUAL_SHA}" > artifacts/candidate-sha.txt
          grep -q "${PAPER_HUE_ACTUAL_SHA}" artifacts/showcase-manifest.json

      - name: Upload screenshot proof
        uses: actions/upload-artifact@v4
        with:
          name: paper-hue-real-screenshots-${{ env.PAPER_HUE_ACTUAL_SHA }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Stop WordPress runtime
        if: always()
        run: npx wp-env stop
