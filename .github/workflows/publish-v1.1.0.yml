name: Publish Paper Hue 1.1.0

on:
  push:
    branches:
      - 'release/publish-v1.1.0'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact production release commit
        uses: actions/checkout@v4
        with:
          ref: 4bacf51d9de3697ee3b93a451c2589826a4d5d84

      - name: Verify production identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "4bacf51d9de3697ee3b93a451c2589826a4d5d84"
          test "$(git rev-parse HEAD^{tree})" = "16d7303052bf1e759019cdae872d9448b9d36243"

      - name: Build exact distribution package
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/paper-hue
          rsync -a ./ dist/paper-hue/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.gitattributes' \
            --exclude '.gitignore' \
            --exclude '.wp-env.json' \
            --exclude 'artifacts/' \
            --exclude 'dist/' \
            --exclude 'docs/' \
            --exclude 'node_modules/' \
            --exclude 'vendor/' \
            --exclude 'tools/' \
            --exclude 'client-side/demo-short-codes/' \
            --exclude 'client-side/img/banner1.jpeg' \
            --exclude 'client-side/img/banner2.jpeg' \
            --exclude 'client-side/img/banner3.jpeg' \
            --exclude 'client-side/img/banner4.jpeg' \
            --exclude 'client-side/img/paper_hue_fallback.jpeg' \
            --exclude 'composer.json' \
            --exclude 'composer.lock' \
            --exclude 'phpcs.xml.dist'
          ( cd dist && zip -qr paper-hue-1.1.0.zip paper-hue )
          test -f dist/paper-hue/style.css
          test -f dist/paper-hue/functions.php
          test -f dist/paper-hue/readme.txt
          test -f dist/paper-hue/LICENSE
          test -f dist/paper-hue/screenshot.jpg
          test -f dist/paper-hue/client-side/img/paper-hue-fallback.svg
          test ! -e dist/paper-hue/client-side/img/banner1.jpeg
          test ! -e dist/paper-hue/client-side/img/banner2.jpeg
          test ! -e dist/paper-hue/client-side/img/banner3.jpeg
          test ! -e dist/paper-hue/client-side/img/banner4.jpeg
          test ! -e dist/paper-hue/client-side/img/paper_hue_fallback.jpeg
          unzip -t dist/paper-hue-1.1.0.zip
          sha256sum dist/paper-hue-1.1.0.zip > dist/SHA256SUMS
          cat dist/SHA256SUMS

      - name: Publish v1.1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.1.0 >/dev/null 2>&1; then
            echo 'v1.1.0 already exists; refusing to replace an existing release.' >&2
            exit 1
          fi
          cat > /tmp/release-notes.md <<'EOF'
          Paper Hue 1.1 modernizes the classic theme without changing its identity.

          Highlights:
          - WordPress 7.1 compatibility with PHP 7.4 through 8.5 validation
          - repaired Hero Slider text and control-bar geometry
          - deliberate responsive breakpoints for tablet, mobile, and small phones
          - premium Theme Control Center with no duplicate setting ownership
          - complete Customizer ownership for Paper Hue presentation settings
          - improved keyboard/mobile navigation and accessibility behavior
          - Featured Story and Recent Articles controls
          - governed real-browser screenshot proof and release-readiness burn
          - current WordPress Theme Check and package verification

          Release source: `master@4bacf51d9de3697ee3b93a451c2589826a4d5d84`
          Proven tree: `16d7303052bf1e759019cdae872d9448b9d36243`
          EOF
          gh release create v1.1.0 \
            --target 4bacf51d9de3697ee3b93a451c2589826a4d5d84 \
            --title 'Paper Hue 1.1.0' \
            --notes-file /tmp/release-notes.md \
            dist/paper-hue-1.1.0.zip \
            dist/SHA256SUMS
