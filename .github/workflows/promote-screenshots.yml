name: Promote governed screenshots

on:
  push:
    branches:
      - docs/promote-real-screenshots
    paths:
      - '.github/workflows/promote-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  promote:
    name: Promote exact browser captures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout promotion branch
        uses: actions/checkout@v4
        with:
          ref: docs/promote-real-screenshots

      - name: Download governed screenshot artifact
        uses: actions/download-artifact@v4
        with:
          name: paper-hue-real-screenshots-0e4532742b6e4c0d2097df29edc0bcb86fc9eadf
          path: .promotion-artifact
          github-token: ${{ github.token }}
          repository: agustealo/paper-hue
          run-id: 36321800604

      - name: Promote exact PNG captures
        run: |
          set -euo pipefail
          rm -rf docs/screenshots
          mkdir -p docs/screenshots
          cp .promotion-artifact/screenshots/*.png docs/screenshots/
          cp .promotion-artifact/showcase-manifest.json docs/screenshots/showcase-manifest.json
          cp .promotion-artifact/wordpress-version.txt docs/screenshots/wordpress-version.txt
          cp .promotion-artifact/php-version.txt docs/screenshots/php-version.txt
          rm -rf .promotion-artifact

      - name: Commit promoted evidence
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo 'No screenshot changes to commit.'
            exit 0
          fi
          git commit -m 'Promote governed Paper Hue screenshots'
          git push origin HEAD:docs/promote-real-screenshots
