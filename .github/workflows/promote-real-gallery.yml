name: Promote Paper Hue corrected real gallery

on:
  push:
    branches:
      - 'docs/paper-hue-1-1-gallery-v2'
    paths:
      - '.github/workflows/promote-real-gallery.yml'

permissions:
  actions: read
  contents: write

jobs:
  promote:
    name: Promote corrected production screenshots
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout gallery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact corrected production proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf .gallery-proof
          mkdir -p .gallery-proof
          gh run download 36324958405 \
            --repo agustealo/paper-hue \
            --name paper-hue-real-screenshots-9e8f296e461ce4006afaa4f88709e8e06d7c9d88 \
            --dir .gallery-proof

      - name: Verify production and visual-proof provenance
        run: |
          set -euo pipefail
          EXPECTED='9e8f296e461ce4006afaa4f88709e8e06d7c9d88'
          test "$(cat .gallery-proof/candidate-sha.txt)" = "${EXPECTED}"
          grep -q "${EXPECTED}" .gallery-proof/showcase-manifest.json
          grep -q '"authenticatedAdminProof": true' .gallery-proof/showcase-manifest.json
          test -f .gallery-proof/screenshots/01-front-page-desktop.png
          test -f .gallery-proof/screenshots/02-hero-slider.png
          test -f .gallery-proof/screenshots/07-front-page-mobile.png
          test -f .gallery-proof/screenshots/08-paper-hue-admin.png
          test -f .gallery-proof/screenshots/09-customizer-homepage.png

      - name: Promote curated screenshot set
        run: |
          set -euo pipefail
          mkdir -p docs/screenshots
          cp .gallery-proof/screenshots/01-front-page-desktop.png docs/screenshots/front-page-desktop.png
          cp .gallery-proof/screenshots/02-hero-slider.png docs/screenshots/hero-slider.png
          cp .gallery-proof/screenshots/07-front-page-mobile.png docs/screenshots/front-page-mobile.png
          cp .gallery-proof/screenshots/08-paper-hue-admin.png docs/screenshots/paper-hue-admin.png
          cp .gallery-proof/screenshots/09-customizer-homepage.png docs/screenshots/customizer-homepage.png

          cat > docs/SCREENSHOT-GALLERY.md <<'EOF'
          # Paper Hue 1.1 real screenshot gallery

          These are real browser captures from the governed Paper Hue presentation proof, not mockups or generated UI.

          - Production candidate: `master@9e8f296e461ce4006afaa4f88709e8e06d7c9d88`
          - WordPress: `7.1`
          - PHP: `8.3`
          - Authenticated admin proof: `true`
          - Hero Slider geometry guard: passed
          - Source artifact: `paper-hue-real-screenshots-9e8f296e461ce4006afaa4f88709e8e06d7c9d88`
          - Artifact digest: `sha256:dbbdd38d3342905c9876eba71fe4edcd5832aa9f076f7dfa1504d18cd8127304`

          ## Desktop homepage

          ![Paper Hue desktop homepage](screenshots/front-page-desktop.png)

          ## Hero Slider

          ![Paper Hue Hero Slider](screenshots/hero-slider.png)

          ## Mobile homepage

          ![Paper Hue mobile homepage](screenshots/front-page-mobile.png)

          ## Appearance → Paper Hue

          ![Paper Hue administration control center](screenshots/paper-hue-admin.png)

          ## Live Customizer

          ![Paper Hue Hero Slider controls in the WordPress Customizer](screenshots/customizer-homepage.png)
          EOF

      - name: Add README gallery
        shell: python
        run: |
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          old = """## Real browser proof\n\nPaper Hue's 1.1 release line is exercised against a real WordPress 7.1 runtime with Playwright. The governed presentation rail captures the exact candidate SHA and includes desktop, mobile, Hero Slider, Featured Story, Recent Articles, single-post, archive, **Appearance → Paper Hue**, and live **Customizer** states.\n\nThe screenshot workflow deliberately rejects mock UI as release evidence. It seeds a disposable WordPress site, imports repository-owned Paper Hue imagery, configures the actual theme, captures the rendered product, records runtime versions and provenance, then destroys the runtime.\n"""
          new = """## Real browser proof\n\nPaper Hue's 1.1 release line is exercised against a real WordPress 7.1 runtime with Playwright. The governed presentation rail captures the exact candidate SHA and includes desktop, mobile, Hero Slider, Featured Story, Recent Articles, single-post, archive, **Appearance → Paper Hue**, and live **Customizer** states.\n\n[View the full real screenshot gallery](docs/SCREENSHOT-GALLERY.md). These captures come from production `master@9e8f296e461ce4006afaa4f88709e8e06d7c9d88`; the workflow asserts the exact checkout identity and rejects a collapsed desktop Hero Slider before publishing evidence.\n\n![Paper Hue real desktop homepage](docs/screenshots/front-page-desktop.png)\n\n<table>\n<tr>\n<td><img src=\"docs/screenshots/hero-slider.png\" alt=\"Paper Hue real Hero Slider\"></td>\n<td><img src=\"docs/screenshots/paper-hue-admin.png\" alt=\"Paper Hue real admin control center\"></td>\n</tr>\n<tr>\n<td><img src=\"docs/screenshots/front-page-mobile.png\" alt=\"Paper Hue real mobile homepage\"></td>\n<td><img src=\"docs/screenshots/customizer-homepage.png\" alt=\"Paper Hue real WordPress Customizer\"></td>\n</tr>\n</table>\n\nThe screenshot workflow deliberately rejects mock UI as release evidence. It seeds a disposable WordPress site, imports Paper Hue's bundled imagery, configures the actual theme, verifies critical slider geometry, captures the rendered product, records runtime versions and provenance, then destroys the runtime.\n"""
          if old not in text:
              raise SystemExit('Expected README browser-proof section not found')
          path.write_text(text.replace(old, new), encoding='utf-8')

      - name: Remove promotion machinery and commit gallery
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/promote-real-gallery.yml
          git add README.md docs/SCREENSHOT-GALLERY.md docs/screenshots
          git commit -m 'Add corrected governed Paper Hue 1.1 screenshot gallery'
          git push origin HEAD:docs/paper-hue-1-1-gallery-v2
