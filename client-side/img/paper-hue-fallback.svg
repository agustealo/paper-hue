  <rect width="1200" height="675" fill="#f4efe3"/>
  <rect x="42" y="42" width="1116" height="591" rx="8" fill="#fbf8f0" stroke="#d8cfbd" stroke-width="2"/>
  <g stroke="#e7dfd0" stroke-width="2">
